name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.tls }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tls:
          - rustls-tls
          - native-tls
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-default-features --features ${{ matrix.tls }}
